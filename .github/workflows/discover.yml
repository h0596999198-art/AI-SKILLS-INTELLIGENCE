name: Discover public skill metadata

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-metadata-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Discover metadata only
        run: |
          mkdir -p discovery-output
          python scripts/discover_sources.py --json-out discovery-output/discovery-report.json --markdown-out discovery-output/discovery-report.md
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-skill-discovery-report
          path: discovery-output/
          if-no-files-found: warn
          retention-days: 14
